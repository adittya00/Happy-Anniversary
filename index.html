<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy 2 Years Anniversary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   COLOURS
   ============================================================ */
:root{
  --pink-bg:#2a0f1e;
  --pink-deep:#ffb6d5;
  --hot:#ff6fa5;
  --spidey-red:#e23a45;
  --spidey-blue:#2f4fa2;
  --cream:#fff7fb;
  --ink:#ffffff;
  --ink-soft:#ffd9ea;
  --strand:rgba(255,255,255,.9);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  font-family:'Fredoka',system-ui,sans-serif;
  color:var(--ink);
  background:#1b0713;            /* dark base — the photo covers it */
  overflow:hidden;
}
/* comic halftone dots over everything (subtle now, over the photo) */
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:2;
  background-image:radial-gradient(rgba(255,255,255,.35) 1.2px, transparent 1.3px);
  background-size:14px 14px;opacity:.18;
}

/* ----- corner spider webs ----- */
.web{position:fixed;width:190px;height:190px;z-index:5;pointer-events:none;opacity:.45}
.web.tl{top:0;left:0}
.web.tr{top:0;right:0;transform:scaleX(-1)}
.web.bl{bottom:0;left:0;transform:scaleY(-1)}
.web.br{bottom:0;right:0;transform:scale(-1,-1)}
.web path,.web line{stroke:#fff;stroke-width:2.2;fill:none;stroke-linecap:round;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))}

/* ----- floating hearts / webs ----- */
.floaties{position:fixed;inset:0;z-index:5;pointer-events:none;overflow:hidden}
.floaty{position:absolute;bottom:-60px;font-size:22px;opacity:.75;animation:rise linear infinite}
@keyframes rise{
  0%{transform:translateY(0) rotate(0);opacity:0}
  10%{opacity:.8}
  100%{transform:translateY(-115vh) rotate(360deg);opacity:0}
}

/* ----- stage & pages ----- */
.stage{position:fixed;inset:0;z-index:4;perspective:1400px}
.page{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  padding:26px 18px;
  transform-origin:50% -75vh;   /* pivot far above screen = pendulum swing */
}

/* FULL-BLEED watermark photo — covers the entire page */
.wm{
  position:absolute;inset:0;z-index:0;
  background-repeat:no-repeat;
  background-position:center center;
  background-size:cover;          /* fills the whole screen, no white edges */
}
.wm.missing{
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(150deg,#3a1226,#66203f 55%,#8d2b56);
}
.wm.missing span{
  font-family:'Caveat',cursive;font-size:20px;color:#fff;
  background:rgba(255,143,181,.85);padding:6px 14px;border-radius:99px;
}
/* readability scrim over the photo (not a white box) */
.scrim{
  position:absolute;inset:0;z-index:1;pointer-events:none;
  background:
    radial-gradient(ellipse at center, rgba(12,2,9,.55) 0%, rgba(12,2,9,.32) 45%, rgba(12,2,9,.62) 100%),
    linear-gradient(180deg, rgba(12,2,9,.45), rgba(12,2,9,.15) 40%, rgba(12,2,9,.55));
}

/* ----- the card (transparent — no white background) ----- */
.card{
  position:relative;z-index:2;width:min(620px,100%);
  background:transparent;
  border:none;border-radius:0;box-shadow:none;
  padding:34px 12px 28px;text-align:center;
}
.bow{position:absolute;top:-30px;left:50%;transform:translateX(-50%);font-size:34px;
  filter:drop-shadow(0 3px 6px rgba(0,0,0,.5))}
.strand{position:absolute;bottom:100%;left:50%;width:3px;height:60vh;
  background:linear-gradient(var(--strand),rgba(255,255,255,.05));transform:translateX(-50%)}

.eyebrow{
  font-family:'Fredoka',sans-serif;
  font-size:12px;letter-spacing:.22em;text-transform:uppercase;font-weight:600;
  color:#ffd9ea;margin:0 0 12px;
  text-shadow:0 2px 8px rgba(0,0,0,.7);
}
h1{
  font-size:clamp(26px,7vw,42px);line-height:1.14;margin:0 0 14px;font-weight:700;
  color:#fff;
  text-shadow:0 0 18px rgba(255,111,165,.65), 0 3px 12px rgba(0,0,0,.75), 2px 2px 0 rgba(226,58,69,.55);
}
.note{
  font-family:'Caveat',cursive;font-size:clamp(20px,4.8vw,26px);line-height:1.45;
  color:#fff;margin:0 0 24px;white-space:pre-line;
  text-shadow:0 2px 10px rgba(0,0,0,.8);
}

/* ----- SINGLE FONT, NO BOLD (slides 2–7) ----- */
.card.plain h1,
.card.plain .note,
.card.plain .eyebrow{
  font-family:'Fredoka',system-ui,sans-serif;
  font-weight:400;
  font-size:clamp(19px,4.6vw,23px);
  line-height:1.5;
  letter-spacing:normal;
  text-transform:none;
  color:#fff;
  text-shadow:0 2px 10px rgba(0,0,0,.8);
}
.card.plain h1{margin:0 0 6px}
.card.plain .eyebrow{margin:0 0 6px;opacity:.85}
.card.plain .note{margin:0 0 24px}

/* ----- buttons ----- */
.btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
button.opt{
  font-family:'Fredoka',sans-serif;font-size:17px;font-weight:600;
  padding:13px 24px;border-radius:99px;border:none;cursor:pointer;
  color:#fff;background:linear-gradient(160deg,var(--hot),#ff9bc4);
  box-shadow:0 7px 0 #e05189, 0 12px 20px rgba(0,0,0,.45);
  transition:transform .12s ease, box-shadow .12s ease;
}
button.opt:active{transform:translateY(5px);box-shadow:0 2px 0 #e05189,0 6px 12px rgba(0,0,0,.4)}
button.opt.no{background:linear-gradient(160deg,#7f9bd6,var(--spidey-blue));box-shadow:0 7px 0 #24407f,0 12px 20px rgba(0,0,0,.4)}
button.opt.no:active{box-shadow:0 2px 0 #24407f}
button.opt:focus-visible{outline:3px solid #fff;outline-offset:3px}
button.opt.wide{width:100%}
button.opt.pop{animation:popIn .5s cubic-bezier(.2,1.5,.4,1) both}
@keyframes popIn{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}

/* stickers */
.sticker{position:absolute;z-index:3;width:110px;pointer-events:none;
  filter:drop-shadow(0 6px 10px rgba(0,0,0,.45));animation:wobble 3.4s ease-in-out infinite}
@keyframes wobble{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}

/* ----- web-swing transitions ----- */
@keyframes swingIn{
  0%{transform:rotate(34deg) translateY(-24vh);opacity:0}
  60%{opacity:1}
  75%{transform:rotate(-7deg) translateY(0)}
  88%{transform:rotate(3deg)}
  100%{transform:rotate(0) translateY(0);opacity:1}
}
@keyframes swingOut{
  0%{transform:rotate(0) translateY(0);opacity:1}
  30%{transform:rotate(9deg)}
  100%{transform:rotate(-40deg) translateY(28vh);opacity:0}
}
.swing-in{animation:swingIn 1s cubic-bezier(.34,.9,.4,1) both}
.swing-out{animation:swingOut .75s cubic-bezier(.55,0,.7,.4) both}

/* thwip line */
.thwip{position:fixed;inset:0;z-index:8;pointer-events:none}
.thwip line{stroke:#fff;stroke-width:4;stroke-linecap:round;filter:drop-shadow(0 0 6px rgba(255,143,181,.9))}

/* ----- progress hearts + back ----- */
.dots{position:fixed;bottom:16px;left:0;right:0;z-index:6;display:flex;gap:9px;justify-content:center;font-size:13px;pointer-events:none}
.dots i{opacity:.3;font-style:normal;transition:.3s;filter:drop-shadow(0 1px 3px rgba(0,0,0,.6))}
.dots i.on{opacity:1;transform:scale(1.35)}
.back,.music{
  position:fixed;bottom:14px;z-index:7;border:none;cursor:pointer;
  width:44px;height:44px;border-radius:50%;font-size:18px;
  background:rgba(255,255,255,.85);color:#5c2b45;
  box-shadow:0 5px 14px rgba(0,0,0,.45);
}
.back{left:16px}
.music{right:16px}

/* ==========================================================
   HUG ANIMATION (last page)
   ========================================================== */
.hug{
  position:fixed;inset:0;z-index:30;display:flex;
  flex-direction:column;align-items:center;justify-content:center;
  background:rgba(14,3,10,.62);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  animation:hugFade .4s ease both;
}
.hug.out{animation:hugFadeOut .5s ease both}
@keyframes hugFade{from{opacity:0}to{opacity:1}}
@keyframes hugFadeOut{from{opacity:1}to{opacity:0}}

.hugScene{position:relative;width:100%;height:190px;display:flex;align-items:center;justify-content:center}
.hugP{position:absolute;font-size:clamp(56px,15vw,84px);filter:drop-shadow(0 8px 16px rgba(0,0,0,.5))}
.hugP.left {animation:walkL 1.5s cubic-bezier(.3,.8,.3,1) both}
.hugP.right{animation:walkR 1.5s cubic-bezier(.3,.8,.3,1) both}
@keyframes walkL{
  0%{transform:translateX(-60vw) rotate(0);opacity:0}
  15%{opacity:1}
  55%{transform:translateX(-52px) rotate(-6deg)}
  75%{transform:translateX(-30px) rotate(4deg)}
  92%{transform:translateX(-16px) rotate(0);opacity:1}
  100%{transform:translateX(-16px);opacity:0}
}
@keyframes walkR{
  0%{transform:translateX(60vw) rotate(0);opacity:0}
  15%{opacity:1}
  55%{transform:translateX(52px) rotate(6deg)}
  75%{transform:translateX(30px) rotate(-4deg)}
  92%{transform:translateX(16px) rotate(0);opacity:1}
  100%{transform:translateX(16px);opacity:0}
}
.hugBig{
  position:absolute;font-size:clamp(80px,22vw,130px);opacity:0;
  filter:drop-shadow(0 10px 22px rgba(0,0,0,.55));
  animation:hugPop 2.4s cubic-bezier(.2,1.4,.4,1) 1.35s both;
}
@keyframes hugPop{
  0%{transform:scale(.2);opacity:0}
  22%{transform:scale(1.22);opacity:1}
  38%{transform:scale(.96)}
  52%{transform:scale(1.06)}
  70%{transform:scale(1)}
  100%{transform:scale(1);opacity:1}
}
.hugRing{
  position:absolute;width:120px;height:120px;border-radius:50%;
  border:4px solid rgba(255,143,181,.9);opacity:0;
  animation:ring 1.1s ease-out 1.45s both;
}
@keyframes ring{0%{transform:scale(.3);opacity:.9}100%{transform:scale(3.2);opacity:0}}
.hugCap{
  font-family:'Caveat',cursive;font-size:clamp(26px,7vw,38px);color:#fff;
  margin:14px 0 0;text-shadow:0 3px 14px rgba(0,0,0,.8);
  opacity:0;animation:capIn .7s ease 1.9s both;
}
@keyframes capIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.hugHeart{position:absolute;pointer-events:none;font-size:26px}

@media (prefers-reduced-motion:reduce){
  .swing-in,.swing-out,.floaty,.sticker,.hugP,.hugBig,.hugRing,.hugCap{
    animation-duration:.01ms!important;animation-iteration-count:1!important}
}
</style>
</head>
<body>

<div class="floaties" id="floaties"></div>

<script>
/* ==================================================================
   ✏️  EVERYTHING YOU EDIT IS IN THIS BOX
   ------------------------------------------------------------------
   1. Make a folder called  images  next to this file.
   2. Put your photos in it and write the file name in "bg".
   3. Change any text you like. Use \n for a new line.
   ================================================================== */

const SETTINGS = {
  herName: "Baby",           // ← her name / nickname
  song: "",                  // e.g. "music/oursong.mp3" ("" = no music)
  watermarkOpacity: 1,       // photo now fills the screen; 1 = full strength
  hugEmojis: ["🧑","👩"]      // the two people who run into the hug
};

const PAGES = [

  /* 1 ─ HAPPY ANNIVERSARY */
  {
    bg: "images/1-anniversary.jpg",
    eyebrow: "22 August · two whole years with this old woman",
    title: "Happy 2 Years Anniversary Babuuuuuuu",
    text: "Do you wanna spend more...\nor am I already boring?",
    buttons: [
      { label: "Yes, more ", action: "next" },
      { label: "You're boring ", action: "no", style: "no" }
    ],
    noReply: "Ghushiiiiii marbooooo shoitannnn"
  },

  /* 2 ─ INTRO COUPLE PIC */
  {
    bg: "images/2-couple.jpg",
    eyebrow: "Most emotionally unavailable & not understanding guy with most emotional woman",
    title: "Still choose me?",
    text: "Throughout these 2 years, I'm pretty sure that the thought of leaving me was across your mind for a hundred times. Yet, you choose to stay. Though I don't appreciate you at all nowadays, but you really mean the world to me. You're the person who made me feel special, made me feel worth and with whom I sahre all the sweetest memories of my life. Not being expressive towards your love and not understanding your feelings correctly always made me feel guilty amd made me question myslef that do I really deserve you or not. It's very obvious that you can get someone way better than me in every aspect but loving me might be the curse of your life for sure. Anyways, I hope you'll bear me for lifetime and eat my ghushi forever. I loveeeeeeeeeeeeeeeeee youuuuuuuuuuuuuuu soooooooooooooooooooo muchhhhhhhhhhhhhhhhhhh. ",
    buttons: [
      { label: "Haeeeeeeeeeeeee", action: "next" },
      { label: "na", action: "no", style: "no" }
    ],
    noReply: "Shahoshhhh kotttoboroooo, amar priyo shashurimaaaa keee boleeeeeeeee dibooooooooooooo"
  },

  /* 3 ─ COUPLE PIC 2 */
  {
    bg: "images/3-couple2.jpg",
    eyebrow: "weeeeeeeeeeee",
    title: "Boss always right, Secretary left",
    text: "Doing silly things, talking bullshit with no sense at all, bullying you \n These are the thiings I love about us. I don't want any gifts, any surprises or anything. What I really want from you is the exactly same bond with you everyday with no jhograjhati at all. ",
    buttons: [{ label: "Boss er kotha Shunba shobshomoy", action: "next" }]
  },

  /* 4 ─ CANDID 1 */
  {
    bg: "images/4-candid1.jpg",
    eyebrow: "HQHQHQ",
    title: "Haaatir maatha",
    text: "Ghushi mere Phone mukher bhitor dhukai dibo shoitan",
    buttons: [{ label: "Reel scroll na kore shamne agao naile mairrr", action: "next" }]
  },

  /* 5 ─ WEDDING PHOTO */
  {
    bg: "images/5-wedding.jpg",
    eyebrow: "Ghochu bandor er shathe ekti chobi",
    title: "jekhane shekhane dhoradhori ",
    text: "EKdin tomake chobi theke laathi mere ber kore diye amar priyo shashurimaar shathe chobi tulbo",
    buttons: [{ label: "ar beshidur nai", action: "next" }]
  },

  /* 6 ─ SORRY & REASSURANCE */
  {
    bg: "images/6-sorry.jpg",
    eyebrow: "Visual representation of us in basha",
    title: "khali reels ar reels",
    text: "jid dekhai amake ignore korle erokom chehara e hoi amar. jai hok, keep doing as you can't control yourself. ekdin shotti shotti ghushi mere dibo ",
    buttons: [{ label: "Shamne Shabdhan...", action: "next" }]
  },

  /* 7 ─ BLACKMAIL CANDID */
  {
    bg: "images/7-candid2.jpg",
    eyebrow: "😈",
    title: "Censored ",
    text: "Amar kache tomar gopon chobi ase. aro pathao nahoy net e chere dibo😈😈😈",
    buttons: [
      { label: "Pathaboooooo", action: "next" },
      { label: "Pathabona", action: "no", style: "no" }
    ],
    noReply: "Shutuppp, pathate hobeeeee"
  },

  /* 8 ─ ENDING */
  {
    bg: "images/8-ending.jpg",
    eyebrow: "Amraaaaaaaaaaa",
    title: "Happy 2 Years 💗",
    text: "Shoitani apart, I loveeeeeeeeeeeeeeeeee youuuuuuuuuuuuuuuu sooooooooooooooooooooooooo muchhhhhhhhhhhhhhhhhhh amarrrrrrrrrr lokkhiiiiiiiiiibabuuuuuuuuuuuuuu. Amiiiiiiiiiiiiiiiiiii tomakeeeeeeeeeeeeeee onnnnnnnnnekkkkk bhaloooooobashiiiiii. \n Cholooo hugggg koriiiiiiiii",
    buttons: [{ label: "Haeeeeeeeeeeeeeeee", action: "hug" }],
    hugCaption: "Ashooooooooooo 🫂",
    confetti: true
  }
];

/* Slides that use ONE font with no bold heading (1-based: slides 2 to 7) */
const PLAIN_FROM = 2, PLAIN_TO = 7;

/* ==================== stop editing here ==================== */

const stage=document.getElementById('stage'),thwipSvg=document.getElementById('thwip'),
      dotsEl=document.getElementById('dots'),backBtn=document.getElementById('back'),
      musicBtn=document.getElementById('music'),bgm=document.getElementById('bgm');
let index=0,currentEl=null,busy=false;

/* floating hearts + webs */
['💗','🎀','🕸️','✨','💘','🕷️','🩷','⭐'].forEach(e=>{
  for(let n=0;n<3;n++){
    const s=document.createElement('div');
    s.className='floaty';s.textContent=e;
    s.style.left=Math.random()*100+'%';
    s.style.fontSize=(14+Math.random()*18)+'px';
    s.style.animationDuration=(11+Math.random()*12)+'s';
    s.style.animationDelay=(-Math.random()*20)+'s';
    document.getElementById('floaties').appendChild(s);
  }
});

/* progress hearts */
PAGES.forEach(()=>{const i=document.createElement('i');i.textContent='💗';dotsEl.appendChild(i)});
function paintDots(){[...dotsEl.children].forEach((d,i)=>d.classList.toggle('on',i<=index))}

function buildPage(p,i){
  const page=document.createElement('section');
  page.className='page';

  /* full-bleed photo */
  const wm=document.createElement('div');
  wm.className='wm';
  wm.style.opacity=SETTINGS.watermarkOpacity;
  if(p.bg){
    const test=new Image();
    test.onload=()=>{wm.style.backgroundImage='url("'+p.bg+'")'};
    test.onerror=()=>{wm.classList.add('missing');wm.innerHTML='<span>add your photo here → '+p.bg+'</span>'};
    test.src=p.bg;
  }else{
    wm.classList.add('missing');
  }
  page.appendChild(wm);

  const scrim=document.createElement('div');
  scrim.className='scrim';
  page.appendChild(scrim);

  const plain=(i+1)>=PLAIN_FROM && (i+1)<=PLAIN_TO;

  const card=document.createElement('div');
  card.className='card'+(plain?' plain':'');
  card.innerHTML='<div class="strand"></div><div class="bow">🎀</div>'+
    (p.eyebrow?'<p class="eyebrow">'+p.eyebrow+'</p>':'')+
    '<h1>'+p.title.replace('{name}',SETTINGS.herName)+'</h1>'+
    '<p class="note">'+p.text.replace('{name}',SETTINGS.herName)+'</p>';

  const btns=document.createElement('div');
  btns.className='btns';
  p.buttons.forEach(b=>btns.appendChild(makeBtn(b,p,btns)));
  card.appendChild(btns);
  page.appendChild(card);

  if(p.stickers) p.stickers.forEach(s=>{
    const img=document.createElement('img');
    img.className='sticker';img.src=s.src;img.alt='';
    img.style.top=s.top||'auto';img.style.left=s.left||'auto';
    img.style.right=s.right||'auto';img.style.bottom=s.bottom||'auto';
    if(s.width)img.style.width=s.width;
    img.onerror=()=>img.remove();
    page.appendChild(img);
  });

  if(p.confetti) setTimeout(confetti,600);
  return page;
}

function makeBtn(b,p,holder){
  const el=document.createElement('button');
  el.className='opt'+(b.style==='no'?' no':'');
  el.textContent=b.label;
  el.onclick=()=>{
    startMusic();
    if(b.action==='no'){
      holder.innerHTML='';
      const only=makeBtn({label:p.noReply||"Say yes, you don't have any option 😌",action:'next'},p,holder);
      only.classList.add('wide');
      holder.appendChild(only);
      return;
    }
    if(b.action==='hug'){
      holder.innerHTML='';
      playHug(p.hugCaption||'come here, hug me 🫂',()=>{
        const again=makeBtn({label:'Wanna see again? 🔁',action:'restart'},p,holder);
        again.classList.add('wide','pop');
        holder.appendChild(again);
      });
      return;
    }
    if(b.action==='restart'){go(0);return}
    go(index+1);
  };
  return el;
}

function go(i){
  if(busy||i<0||i>=PAGES.length)return;
  busy=true;index=i;
  thwip();
  const next=buildPage(PAGES[i],i);
  next.classList.add('swing-in');
  stage.appendChild(next);
  if(currentEl){
    const old=currentEl;
    old.classList.add('swing-out');
    setTimeout(()=>old.remove(),780);
  }
  currentEl=next;
  paintDots();
  setTimeout(()=>{next.classList.remove('swing-in');busy=false},1020);
}

/* ---------- the hug ---------- */
function playHug(caption,done){
  const box=document.createElement('div');
  box.className='hug';
  box.innerHTML=
    '<div class="hugScene">'+
      '<span class="hugRing"></span>'+
      '<span class="hugP left">'+SETTINGS.hugEmojis[0]+'</span>'+
      '<span class="hugP right">'+SETTINGS.hugEmojis[1]+'</span>'+
      '<span class="hugBig">🫂</span>'+
    '</div>'+
    '<p class="hugCap">'+caption+'</p>';
  document.body.appendChild(box);

  /* hearts burst the moment they meet */
  setTimeout(()=>heartBurst(box),1420);

  /* fade out, then reveal the "wanna see again?" option */
  setTimeout(()=>{
    box.classList.add('out');
    setTimeout(()=>{box.remove();done&&done()},480);
  },4200);
}

function heartBurst(box){
  const bits=['💗','🩷','💘','✨','🎀'];
  for(let i=0;i<22;i++){
    const h=document.createElement('span');
    h.className='hugHeart';
    h.textContent=bits[i%bits.length];
    h.style.left='50%';h.style.top='42%';
    h.style.fontSize=(16+Math.random()*20)+'px';
    box.appendChild(h);
    const a=(Math.random()*Math.PI*2), d=90+Math.random()*190;
    h.animate([
      {transform:'translate(-50%,-50%) scale(.3)',opacity:1},
      {transform:'translate('+(Math.cos(a)*d-50)+'%,'+(Math.sin(a)*d-50)+'%) scale(1.1) rotate('+(Math.random()*360-180)+'deg)',opacity:0}
    ],{duration:1300+Math.random()*900,easing:'cubic-bezier(.15,.7,.3,1)'}).onfinish=()=>h.remove();
  }
}

/* the web line that shoots across the screen */
function thwip(){
  const w=innerWidth,h=innerHeight;
  thwipSvg.setAttribute('viewBox','0 0 '+w+' '+h);
  const line=document.createElementNS('http://www.w3.org/2000/svg','line');
  const fromLeft=Math.random()>.5;
  line.setAttribute('x1',fromLeft?0:w);line.setAttribute('y1',h*.85);
  line.setAttribute('x2',fromLeft?w:0);line.setAttribute('y2',h*.12);
  const len=Math.hypot(w,h*.73);
  line.setAttribute('stroke-dasharray',len);
  line.setAttribute('stroke-dashoffset',len);
  thwipSvg.appendChild(line);
  line.animate(
    [{strokeDashoffset:len},{strokeDashoffset:0,offset:.45},{strokeDashoffset:-len}],
    {duration:800,easing:'cubic-bezier(.4,0,.2,1)'}
  ).onfinish=()=>line.remove();
}

function confetti(){
  const bits=['💗','🎀','✨','🩷','💘','🕸️'];
  for(let i=0;i<40;i++){
    const c=document.createElement('div');
    c.textContent=bits[i%bits.length];
    c.style.cssText='position:fixed;z-index:9;pointer-events:none;top:-40px;font-size:'+(16+Math.random()*18)+'px;left:'+Math.random()*100+'%';
    document.body.appendChild(c);
    c.animate([{transform:'translateY(0) rotate(0)',opacity:1},
               {transform:'translateY(110vh) rotate('+(Math.random()*720-360)+'deg)',opacity:.2}],
      {duration:2600+Math.random()*2200,easing:'ease-in'}).onfinish=()=>c.remove();
  }
}

/* music */
let musicOn=false;
function startMusic(){
  if(!SETTINGS.song||musicOn)return;
  bgm.src=SETTINGS.song;bgm.volume=.45;
  bgm.play().then(()=>{musicOn=true;musicBtn.textContent='🔊'}).catch(()=>{});
}
musicBtn.onclick=()=>{
  if(!SETTINGS.song)return;
  if(bgm.paused){startMusic();bgm.play();musicBtn.textContent='🔊'}
  else{bgm.pause();musicBtn.textContent='🎵'}
};
if(!SETTINGS.song)musicBtn.style.display='none';

backBtn.onclick=()=>go(index-1);
go(0);
</script>
